[package]
name = "wakeshot-tray"
description = "Wakeshot tray app: keeps the PC awake only while something needs it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Declared before any wiring (`p1-contracts`), so no track changes `Cargo.lock`. The bins call Windows only through
# `wakeshot-windows`, so no track adds a `windows` feature here; feature unification gives the bins every feature the
# lib turns on.
[dependencies]
wakeshot-core.workspace = true
wakeshot-windows.workspace = true
# The tray only, and only `velo.rs` names it: it brings 113 packages and needs clang for ARM64 (`ring`), and the CLI
# needs none of it.
velopack.workspace = true

[dependencies.windows]
workspace = true
features = ["Win32_Foundation"]

[dev-dependencies]
wakeshot-core = { workspace = true, features = ["test-support"] }
wakeshot-windows = { workspace = true, features = ["test-support"] }

[build-dependencies]
embed-resource.workspace = true
