[package]
name = "wakeshot-windows"
description = "Wakeshot's Windows layer: every Windows call the core's commands need."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Fakes for other crates' tests. Only dev-dependencies turn it on, so no exe ships them. The core's fakes come along,
# because this crate's fakes stand in next to them (`FakePlans` with `FakeLiveness`, for example).
test-support = ["wakeshot-core/test-support"]

[dependencies]
wakeshot-core.workspace = true
serde_json.workspace = true

# Every Windows call of the exes goes through this crate, so their `windows` features live here. The `windows` crate
# has no optional dependencies, so a feature never changes `Cargo.lock`. Toast-only WinRT features are left out: v1
# shows balloons.
[dependencies.windows]
workspace = true
features = [
    "Wdk_System_SystemInformation",
    # `NtQueryInformationProcess` for `process::command_line_contains`.
    "Wdk_System_Threading",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_RestartManager",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    # `ILCreateFromPathW` and `SHOpenFolderAndSelectItems` for `shell::show_in_folder`.
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
wakeshot-core = { workspace = true, features = ["test-support"] }

# The manual power harness drives throwaway plan copies through `power::plan::TestPlan`, which only `test-support`
# builds, so no exe ships it.
[[example]]
name = "power_check"
required-features = ["test-support"]
