[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/HaikAsatryan/wakeshot"
# No crate is meant for crates.io; this stops an accidental `cargo publish`.
publish = false

[workspace.dependencies]
wakeshot-core = { path = "crates/wakeshot-core" }
wakeshot-windows = { path = "crates/wakeshot-windows" }
windows = "0.62.2"
embed-resource = "3.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
proptest = "1.12.0"
# Pinned exactly: it must match the `vpk` 1.2.161 that `release.yml` packs the app with.
velopack = "=1.2.161"
# Pinned to the stub with no Unicode tables, which drops ICU from the tray: `url` (from velopack) needs them only for
# non-ASCII host names, and the one URL the tray parses is ASCII.
idna_adapter = "=1.0.0"

[workspace.lints.clippy]
# Every `unsafe` block and impl says why it is sound, in a `// SAFETY:` comment right above it.
undocumented_unsafe_blocks = "warn"

[profile.release]
# Smallest code over fastest: the tray mostly idles, and its exe size is a selling point.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
