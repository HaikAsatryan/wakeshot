[workspace]
members = ["crates/*"]
# Each spike is its own project; without this, a spike build fails because it sits under this root.
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/HaikAsatryan/wakeshot"

# Declared up front by `p1-contracts`, so the parallel tracks never change `Cargo.lock`; a new crate goes through the
# orchestrator.
[workspace.dependencies]
wakeshot-core = { path = "crates/wakeshot-core" }
wakeshot-windows = { path = "crates/wakeshot-windows" }
windows = "0.62.2"
embed-resource = "3.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
proptest = "1.12.0"
# Pinned exactly: it must match the `vpk` 1.2.161 that packs the app (`docs/phases/06-ship.md`).
velopack = "=1.2.161"
# Pinned to the stub with no Unicode tables, which drops ICU from the tray: `url` (from velopack) needs them only for
# non-ASCII host names, and the one URL the tray parses is ASCII (`p6-tray-size`).
idna_adapter = "=1.0.0"

[profile.release]
# Smallest code over fastest: the tray mostly idles, and its exe size is a selling point (`p6-tray-size`).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
