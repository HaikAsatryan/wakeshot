      <stop offset="1" stop-color="#FFFBE8"/>
    </linearGradient>
    <radialGradient id="i-bloom" gradientUnits="userSpaceOnUse" cx="128" cy="106" r="76.8">
      <stop offset="0" stop-color="#FFEA9C" stop-opacity="0.8"/>
      <stop offset="0.625" stop-color="#FFEA9C" stop-opacity="0.44"/>
      <stop offset="0.8" stop-color="#FFEA9C" stop-opacity="0.144"/>
      <stop offset="1" stop-color="#FFEA9C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i-light" gradientUnits="userSpaceOnUse" cx="128" cy="106" r="48" fx="117.44" fy="92.56">
      <stop offset="0.5" stop-color="#FFFBE8"/>
      <stop offset="0.86" stop-color="#FFEA9C"/>
      <stop offset="1" stop-color="#F7DC7F"/>
    </radialGradient>
    <filter id="i-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4.472"/>
    </filter>
    <mask id="i-plate" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect x="11" y="11" width="234" height="234" rx="43.875" fill="#FFF"/>
    </mask>
  </defs>
  <rect x="11" y="13.667" width="234" height="234" rx="43.875" fill="#000" fill-opacity="0.3" filter="url(#i-soft)"/>
  <g mask="url(#i-plate)">
    <rect width="256" height="256" fill="url(#i-ramp)"/>
    <rect width="256" height="256" fill="url(#i-glow)"/>
    <rect width="256" height="256" fill="url(#i-shade)"/>
  </g>
  <rect x="58" y="175" width="140" height="16" rx="8" fill="url(#i-bar)"/>
  <circle cx="128" cy="106" r="76.8" fill="url(#i-bloom)"/>
  <circle cx="128" cy="106" r="48" fill="url(#i-light)"/>
