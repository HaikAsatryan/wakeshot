<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 1018.4 268" width="304" height="80" role="img" aria-label="Wakeshot">
  <!-- The Wakeshot lockup, dark backgrounds: the app icon as in site/wakeshot.svg and the wordmark in Instrument
       Sans SemiBold (site/fonts/OFL.txt), tracking -0.01em as on the page, the letters as outlines so any viewer
       draws them without the font. Written by crates/wakeshot-windows/src/tray/art.rs (write_art_files); change it
       there, not here. -->
