    </linearGradient>
    <radialGradient id="i-glow" gradientUnits="userSpaceOnUse" cx="128" cy="106" r="145.08">
      <stop offset="0" stop-color="#FFEA9C" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#FFEA9C" stop-opacity="0.21"/>
      <stop offset="1" stop-color="#FFEA9C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i-shade" gradientUnits="userSpaceOnUse" x1="0" y1="139.7" x2="0" y2="245">
      <stop offset="0" stop-color="#2C5A26" stop-opacity="0"/>
      <stop offset="1" stop-color="#2C5A26" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="i-bar" gradientUnits="userSpaceOnUse" x1="58" y1="0" x2="198" y2="0">
