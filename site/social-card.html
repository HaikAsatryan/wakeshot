<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Wakeshot social card</title>
  <!-- The source of social-card.png, the picture a shared link to the repo or the page shows (GitHub's social preview,
       og:image). social_card.py draws it at 1280 x 640, GitHub's size for best display. The words are the README's
       first line: change them there first, then here, then run social_card.py. Everything keeps at least 100 px from
       the edges, so a site that crops to 1.91:1 or rounds the corners cuts nothing. -->
  <style>
    @font-face {
      font-family: "Instrument Sans";
      font-style: normal;
      font-weight: 400;
      src: url("fonts/InstrumentSans-Regular.woff2") format("woff2");
    }

    html,
    body {
      margin: 0;
    }

    /* The page's dark hero: the warm light round the icon over the moss haze along the top. The light is stronger than
       the page's (0.16, not 0.1): on a small card it has to carry the idea of a light left on. Its centre is the icon's
       (the lockup's icon centre is 133 of its 1018.4 units across and 133 of 268 down). */
    body {
      position: relative;
      width: 1280px;
      height: 640px;
      overflow: hidden;
      background:
        radial-gradient(circle 449px at 381px 244px, rgba(255, 234, 156, 0.16), transparent),
        radial-gradient(ellipse 960px 352px at 50% 0, rgba(62, 124, 59, 0.26), transparent 70%),
        #121610;
    }

    /* The lockup and the two lines, centred as one block: 184 px of lockup, 46 px gap, two lines of 52 px. */
    img {
      position: absolute;
      left: 290px;
      top: 153px;
      width: 700px;
      height: auto;
    }

    p {
      position: absolute;
      left: 0;
      right: 0;
      top: 383px;
      margin: 0;
      font: 400 40px/1.3 "Instrument Sans", sans-serif;
      color: #eef2e8;
      text-align: center;
    }
  </style>
</head>
<body>
  <img src="wakeshot-lockup-dark.svg" width="700" height="184" alt="Wakeshot">
  <p>Your PC stays awake while your AI agent works.<br>Then it sleeps as usual, with your own power settings back.</p>
</body>
</html>
