name: Pages

# Deploys site/ to GitHub Pages after a stable release is published, or by hand. Pages must be on, with source "GitHub
# Actions", or the deploy job fails; it is turned on at v1 (docs/tasks/p6-pages.md, Result).
#
# Not on `release: published`: release.yml publishes with the GITHUB_TOKEN, and GitHub starts no workflow from an event
# that token made, so that trigger would never fire. A finished Release run starts this one instead. It runs on the
# default branch, while a release event runs on the tag, which the github-pages environment refuses by default (users
# report it; not tested here).
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer run waits instead of cancelling one that is halfway through, as GitHub's own Pages
# starter does.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and upload the page
    # A Release run counts only for a pushed tag (a manual run is a dry run that publishes nothing), only when it
    # succeeded, and only for a stable version: release.yml makes a version with "-" a pre-release. For a run started
    # by a tag push, head_branch holds the tag name. A failed winget job fails the Release run after the release is
    # out; then run this workflow by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The released commit, not the newest one on main, so the page matches what users download.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # --final: a spot that still waits for another card must not go live.
      - name: Check the page
        run: python3 site/check_page.py --final site

      # The check script belongs to the repo, not to the page.
      - name: Leave the check script out of the page
        run: rm site/check_page.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  # The only job that can write to Pages.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
