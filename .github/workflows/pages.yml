name: Pages

# Deploys the page to GitHub Pages after a stable release is published, or by hand. Pages must be on, with source
# "GitHub Actions" (the maintainer sets it once in the repo's Settings > Pages), or the deploy job fails.
#
# Not on `release: published`: release.yml publishes with the GITHUB_TOKEN, and GitHub starts no workflow from an event
# that token made, so that trigger would never fire. A finished Release run starts this one instead. It runs on the
# default branch, while a release event runs on the tag, which the github-pages environment refuses by default (users
# report it; not tested here).
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer run waits instead of cancelling one that is halfway through, as GitHub's own Pages
# starter does.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build, check and upload the page
    # A Release run counts only for a pushed tag (a manual run is a dry run that publishes nothing), only when it
    # succeeded, and only for a stable version: release.yml makes a version with "-" a pre-release. For a run started
    # by a tag push, head_branch holds the tag name. A failed winget job fails the Release run after the release is
    # out; then run this workflow by hand. Run it by hand too once winget has the package, so the page shows the
    # winget line.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The released commit, not the newest one on main, so the page matches what users download.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # The page says only what is true now: the download links once a stable release has the Setup files, "not
      # released yet" before that, the winget line once winget has the package. build_page.py asks GitHub and stops on
      # any answer but a clear yes or no. It also adds the media files from media/ and leaves out the repo's own files.
      - name: Build the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 site/build_page.py _site

      # --final: no "waits for" placeholder left, no block left unbuilt, no file the page does not use.
      - name: Check the page
        run: python3 site/check_page.py --final _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  # The only job that can write to Pages.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
